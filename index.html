<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDV Web - Frente de Caixa</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>

    <section class="status-servidor" id="statusServidor">Carregando status do servidor...</section>
    <button id="instalarPdv" class="instalar-pdv" hidden>Instalar app PDV</button>

    <main class="pdv">
      <header class="topbar">
        <h1>Frente de Caixa Web</h1>
        <nav>
          <button class="top-btn active">🧾 Venda</button>
          <button class="top-btn">🍽 Mesa</button>
          <button class="top-btn">📋 Comanda</button>
          <button class="top-btn">💰 Caixa</button>
        </nav>
      </header>

      <section class="catalogo">
        <div id="categorias" class="categorias"></div>
        <div id="produtos" class="produtos"></div>
      </section>

      <aside class="painel-venda">
        <div class="entrada-item">
          <label for="codigoProduto">Código</label>
          <div class="linha-codigo">
            <input id="codigoProduto" placeholder="Digite ou leia código" />
            <button id="buscarCodigo">...</button>
          </div>

          <label for="qtd">Qtde</label>
          <div class="controles-qtd">
            <button id="menosQtd">-</button>
            <input id="qtd" type="number" value="1" min="1" />
            <button id="maisQtd">+</button>
            <button id="addPorCodigo">🛒</button>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Qtde</th>
              <th>Unitário</th>
              <th>Total</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="itensBody"></tbody>
        </table>

        <section class="totais">
          <h2>Valor Total</h2>
          <div class="valor" id="total">R$ 0,00</div>
          <div class="subinfos">
            <span>Subtotal: <strong id="subtotal">R$ 0,00</strong></span>
            <span>Impostos (18%): <strong id="impostos">R$ 0,00</strong></span>
          </div>
          <div class="acoes">
            <button id="cancelar" class="cancelar">Cancelar</button>
            <button id="finalizar" class="finalizar">Receber e Finalizar</button>
          </div>
        </section>
      </aside>
    </main>

    <section class="fiscal card">
      <h3>Dados para emissão (demo NF-e/NFC-e)</h3>
      <div class="grid">
        <input id="cliente" placeholder="Cliente" />
        <input id="doc" placeholder="CPF/CNPJ" />
        <select id="tipoDocumento">
          <option value="NFCe">NFC-e</option>
          <option value="NFe">NF-e</option>
        </select>
        <select id="pagamento">
          <option>Dinheiro</option>
          <option>Cartão crédito</option>
          <option>Cartão débito</option>
          <option>Pix</option>
        </select>
      </div>
      <pre id="saida">Nenhum documento emitido.</pre>
    </section>

    <script src="app.js"></script>
  </body>
</html>
